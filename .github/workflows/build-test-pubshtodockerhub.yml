name: "build-test-pubshtodockerhub"

# IMPORTANT : personnalisez cette variable pour que les images
# de votre application soient pousées sur dockerhub
# dans le repository ayant ce nom
# exemple, si vous indiquez : abesesr/abes-hello
#   alors l'image sera poussée sur https://hub.docker.com/r/abesesr/abes-hello
env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/theses

on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-test-pubtodockerhub:
    runs-on: ubuntu-latest
    steps:

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Prepare version from git tags/branchs"
        id: docker_tag_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
          flavor: |
            suffix=-batch,onlatest=true
          # Labels OCI : version, revision, created, source, url et licenses sont
          # remplis automatiquement à partir du dépôt et du commit ; ceux-ci complètent
          # ou remplacent les valeurs par défaut.
          labels: |
            org.opencontainers.image.title=theses-batch
            org.opencontainers.image.vendor=Abes

      - name: "Login to DockerHub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and push"
        id: push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.docker_tag_meta.outputs.tags }}
          labels: ${{ steps.docker_tag_meta.outputs.labels }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
