name: "build-test-pubshtodockerhub"

# IMPORTANT : personnalisez cette variable pour que les images
# de votre application soient pousées sur dockerhub
# dans le repository ayant ce nom
# exemple, si vous indiquez : abesesr/abes-hello
#   alors l'image sera poussée sur https://hub.docker.com/r/abesesr/abes-hello
env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/theses

on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
  # PR : tests + analyse Sonar avec attente de la quality gate, sans construire l'image
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-test-pubtodockerhub:
    runs-on: ubuntu-latest
    steps:

      # Tests Maven joués en premier : s'ils échouent, le job s'arrête en échec
      # et aucune image n'est construite ni poussée.
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          # historique complet : Sonar s'en sert pour le blame et le « new code »
          fetch-depth: 0

      - name: "Set up JDK 21"
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: "Maven tests"
        run: >
          mvn --batch-mode --no-transfer-progress
          -Duser.timezone=Europe/Paris
          -Duser.language=fr
          test

      # Analyse SonarQube Cloud avec la couverture JaCoCo produite par l'étape précédente
      # (pas de recompilation ni de nouveau passage des tests).
      # Clé renouvelée chaque mois : une clé de cache n'est jamais réécrite, une clé fixe
      # garderait indéfiniment les analyseurs du premier run. restore-keys est un préfixe
      # (tiret final voulu) : faute de cache pour le mois courant, le plus récent est restauré.
      - name: "Compute SonarQube Cloud cache month"
        id: sonar_cache_month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: "Cache SonarQube Cloud packages"
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.sonar_cache_month.outputs.month }}
          restore-keys: ${{ runner.os }}-sonar-

      # La couverture est lue dans target/site/jacoco/jacoco.xml (chemin par défaut,
      # produit en phase test). Sur une PR, le job attend le verdict de la quality gate
      # et échoue si elle est rouge ; ailleurs l'analyse est seulement envoyée.
      - name: "SonarQube Cloud analysis"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
          -Dsonar.organization=${{ vars.SONAR_ORGANISATION }}
          -Dsonar.projectKey=${{ vars.SONAR_ORGANISATION }}_${{ github.event.repository.name }}
          -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

      # Image Docker : jamais construite pour une PR
      - name: "Set up Docker Buildx"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: "Prepare version from git tags/branchs"
        if: github.event_name != 'pull_request'
        id: docker_tag_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
          # Labels OCI : version, revision, created, source, url et licenses sont
          # remplis automatiquement à partir du dépôt et du commit ; ceux-ci complètent
          # ou remplacent les valeurs par défaut.
          labels: |
            org.opencontainers.image.title=theses-batch
            org.opencontainers.image.vendor=Abes

      - name: "Login to DockerHub"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and push"
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.docker_tag_meta.outputs.tags }}
          labels: ${{ steps.docker_tag_meta.outputs.labels }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
