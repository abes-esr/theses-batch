spring:
  application:
    name: theses-batch
  batch:
    job:
      enabled: false # Contrôlé par ThesesBatchRunner (anr ou datagouv)
    jdbc:
      initialize-schema: always # Crée automatiquement les tables BATCH_* au démarrage
    # Désactive l'implémentation legacy de ChunkOrientedTasklet (dépréciée dans Spring Batch 6.0)
    # pour utiliser la nouvelle implémentation moderne compatible avec Spring Batch 7.0
    tasklet:
      chunk-oriented: false
  datasource:
    # Configuration H2 persistante pour permettre la reprise des jobs Spring Batch
    url: "jdbc:h2:file:/data/batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  # Configuration pour H2 : stocker les données dans un fichier persistant
  h2:
    console:
      enabled: false
      path: /h2-console

app:
  output-dir: ${OUTPUT_DIR:/output}
  anr:
    pattern: ${THESES_BATCH_ANR_PATTERN:ANR-(?:\d{2}-)?[A-Za-z0-9]{4,8}(?:-\d{1,4})?|Agence nationale de la recherche|Labex|\bPIA\b}
    input-dir: /input
    max-files: ${THESES_BATCH_ANR_MAX_FILES:500000}
    offset: ${THESES_BATCH_ANR_OFFSET:0}
    nb-pages: ${THESES_BATCH_ANR_NB_PAGES:50}
    context-characters: ${THESES_BATCH_ANR_CONTEXT_CHARACTERS:50}
    chunk-size: ${THESES_BATCH_ANR_CHUNK_SIZE:500}
    exclude-keywords: ${THESES_BATCH_ANR_EXCLUDE_KEYWORDS:annexe,resume,résumé,abstract,errata,summary,erratum,annexes,appendix,appendices,titre,couverture,couv,cover,synthese,synthèse,glossaire,illustr,diff,image,table,sommaire,garde,planche,annnexe,annex_}
    # Répertoires exclus du parcours : motifs glob séparés par des virgules, comparés au chemin du
    # répertoire relatif à input-dir (séparateur « / », sensible à la casse ; * = un nom ou une partie,
    # ? = un caractère, ** = un nombre quelconque de niveaux). Le parcours ne descend pas dans un
    # répertoire exclu : aucun de ses fichiers n'est listé ni traité. Vide = aucun répertoire exclu.
    # Exemple : */*/temp exclut le temp/ de chaque thèse (ETAB/THESE_x/temp), y compris pour les thèses
    # qui n'ont pas de document/ (≈ 0,15 % des thèses, dont les correspondances sont alors perdues).
    # ATTENTION : toute exclusion change la liste triée des fichiers ; les valeurs d'offset et de
    # max-files d'un run fait avec une autre valeur de cette clé ne désignent plus les mêmes fichiers.
    exclude-dirs: ${THESES_BATCH_ANR_EXCLUDE_DIRS:}
    # Nombre de répertoires listés simultanément lors du parcours de input-dir.
    # Sur un partage réseau (NFS), le parcours attend surtout le serveur : 8 à 32 recouvrent ces attentes.
    scan-threads: ${THESES_BATCH_ANR_SCAN_THREADS:8}
    # Fichier de départ pour la reprise (chemin complet ou partie du chemin)
    # Exemple: /input/directory/document.pdf ou document.pdf
    start-file: ${THESES_BATCH_ANR_START_FILE:}
    # Nombre de PDF traités simultanément (extraction du texte, recherche, appel Solr) dans chaque chunk.
    # 1 = traitement séquentiel. Au-delà du nombre de cœurs, le gain devient faible ; prévoir le heap en
    # conséquence (≈ 3 Go mesurés pour 16 threads sur l'échantillon local).
    process-threads: ${THESES_BATCH_ANR_PROCESS_THREADS:8}
    # Intervalle minimal entre deux lignes « Progression » dans le log (fichiers traités / total,
    # correspondances, erreurs, débit, temps restant), vérifié après chaque chunk. 0 = à chaque chunk.
    progress-interval: ${THESES_BATCH_ANR_PROGRESS_INTERVAL:30s}
    # Taille maximale d'un PDF lu en entier en mémoire, par gros blocs séquentiels, avant l'analyse.
    # Sur NFS, c'est bien moins d'allers-retours avec le serveur que la lecture par pages de 4 ko de
    # PDFBox. Au-delà, le PDF est lu par blocs de read-block-size au fil de l'analyse. Heap : jusqu'à
    # process-threads × cette taille en plus dans le pire cas (16 × 64 Mo = 1 Go). 0 = jamais en mémoire.
    in-memory-max-size: ${THESES_BATCH_ANR_IN_MEMORY_MAX_SIZE:64MB}
    # Taille des blocs lus dans les PDF plus gros que in-memory-max-size : chaque bloc est lu une seule
    # fois, au moment où PDFBox en a besoin, et gardé en mémoire jusqu'à la fin du fichier. 128KB = le
    # rsize du montage NFS de prod (une requête par bloc). Plus petit : moins d'octets lus mais plus de
    # requêtes ; plus grand : l'inverse. 4KB redonne le nombre de lectures de l'ancienne lecture PDFBox.
    # De 1B à 1MB.
    read-block-size: ${THESES_BATCH_ANR_READ_BLOCK_SIZE:128KB}
    # Polices TrueType (.ttf / .ttc) servant à reconstituer le texte des PDF dont les polices
    # n'ont pas de correspondance Unicode (PDF Word : Times New Roman, Arial, Calibri...).
    # Vide = désactivé. Windows : C:/Windows/Fonts ; Linux : /usr/share/fonts
    fonts-dir: ${THESES_BATCH_ANR_FONTS_DIR:/usr/share/fonts}
    # Configuration des writers
    writers:
      enabled: ${THESES_BATCH_ANR_WRITERS_ENABLED:csv,json}
      header: ${THESES_BATCH_ANR_WRITERS_HEADER:file_path,file_name,page_number,match_value,preceding_context,following_context,analyzed_pages_number,total_pages,processing_time,nnt,doi,defense_date,error_message}
    json:
      pretty-print: ${THESES_BATCH_ANR_JSON_PRETTY_PRINT:true}
  datagouv:
    # URL de base de data.gouv.fr (https://www.data.gouv.fr en production, https://demo.data.gouv.fr pour tester)
    base-url: ${DATA_GOUV_BASE_URL:}
    api-key: ${DATA_GOUV_API_KEY:}
    dataset-id: ${DATA_GOUV_DATASET_ID:}
    csv-resource-id: ${DATA_GOUV_CSV_RESOURCE_ID:}
    json-resource-id: ${DATA_GOUV_JSON_RESOURCE_ID:}
    jsonl-resource-id: ${DATA_GOUV_JSONL_RESOURCE_ID:}
    jsonl-gz-resource-id: ${DATA_GOUV_JSONL_GZ_RESOURCE_ID:}
    upload-enabled: ${DATA_GOUV_UPLOAD_ENABLED:false}
    # Les fichiers plus gros sont envoyés en plusieurs morceaux de cette taille (un seul morceau en mémoire à la fois).
    upload-chunk-size: ${DATA_GOUV_UPLOAD_CHUNK_SIZE:10MB}
    force-run: ${FORCE_RUN:false}
    mode-test: ${MODE_TEST:${app.mode-test:false}}
  theses:
    api-base-url: ${THESES_API_BASE_URL:}
    page-size: ${THESES_PAGE_SIZE:1000}
    connect-timeout: ${THESES_CONNECT_TIMEOUT:30s}
    read-timeout: ${THESES_READ_TIMEOUT:60s}
  solr:
    enabled: ${THESES_BATCH_SOLR_ENABLED:true}
    base-url: ${THESES_BATCH_SOLR_BASE_URL:}
    id-field: ${THESES_BATCH_SOLR_ID_FIELD:id}
    nnt-field: ${THESES_BATCH_SOLR_NNT_FIELD:nnt}
    doi-field: ${THESES_BATCH_SOLR_DOI_FIELD:doi}
    defense-date-field: ${THESES_BATCH_SOLR_DEFENSE_DATE_FIELD:dateSoutenance_dt}
    connect-timeout: ${THESES_BATCH_SOLR_CONNECT_TIMEOUT:5000}
    read-timeout: ${THESES_BATCH_SOLR_READ_TIMEOUT:5000}

# Logging : appenders et niveaux dans log4j2-spring.xml
# Surcharge ponctuelle : --logging.level.fr.theses.batch=DEBUG
