spring:
  application:
    name: theses-batch
  batch:
    job:
      enabled: true
  # Depuis Spring Boot 4, spring-boot-starter-batch fonctionne sans base :
  # le JobRepository est en memoire et aucune table BATCH_* n'est creee.
  # Cette datasource ne sert donc qu'a JPA (entite ANRMatch ecrite par le writer).
  datasource:
    url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  anr:
    pattern: ANR-(?:\d{2}-)?[A-Za-z0-9]{4,8}(?:-\d{1,4})?\b
    root-dir: C:/Users/delafontaine.LEVANT/Documents/STD/starstock
    output-dir: /output
    max-files: 10000
    offset: 0
    nb-pages: 50
    context-characters: 50
    chunk-size: 100
    exclude-keywords: annexe,resume,résumé,abstract,errata,summary,erratum,annexes,appendix,appendices,titre,couverture,couv,cover,synthese,synthèse,glossaire,illustr,diff,image,table,sommaire,garde,planche,annnexe,annex_

# Logging : appenders et niveaux dans log4j2-spring.xml
# Surcharge ponctuelle : --logging.level.fr.theses.batch=DEBUG
